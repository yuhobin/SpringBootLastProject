name: Deploy With Docker to AWS Server
# 실행 조건
on:
  push:
    # main으로 commit & push인 경우 
    branches:
      - main #main commit and push = [main,master]
jobs:
  deploy:
    # Github Actions가 제공하는 Ubuntu환경에서 실행
    # AWS EC2가 아니고 Github Actions 임시로 사용하는 Ubuntu
    runs-on: ubuntu-latest
    #  실행 순서 지정 
    #  name = stage = step
    steps:
     # 어떤 소스를 가지고 올지 => src / build.grade gradlew Dockerfile
     #코드 체크 (Repository)
     - name: Checkout:repository
       uses: actions/checkout@v4
     #JDK 설정 => SpringBoot프로젝트를 build => JDK 설정 
     - name: SetUp JDK 21
       uses: actions/setup-java@v4
       with:
         # 가장 최소단위 JDK = 이클립스 JDK 사용
         distribution: 'temurin'
         java-version: '21'
     # 환경 설정 
     # DB관련 => .env 
     - name: 환경설정
       run: |
          # 기존의 파일 삭제
          rm -f .env
          # 새로운 .env 생성 
          touch .env
          echo "DB_URL=${{secrets.DB_URL}}" >> .env
          echo "DB_USERNAME=${{secrets.DB_USERNAME}}" >> .env
          echo "DB_PASSWORD=${{secrets.DB_PASSWORD}}" >> .env
          
     # Gradlew 권한 부여 
     - name: Set gradlew permission
       run: |
         chmod +x ./gradlew
     # Gradle Build 
     - name: Build with Gradlew
       run: ./gradlew clean build -x test
     # Docker Hub 연결 = 로그인 
     - name: Login DockerHub
       run: |
         echo "${{secrets.DOCKERHUB_PASSWORD}}" |\
         docker login \
         -u "${{secrets.DOCKERHUB_USERNAME}}" \
         --password-stdin
     # Docker 이미지 생성 
     - name: Build Docker Image 
       run: |
         docker build \
          -t ${{secrets.DOCKERHUB_USERNAME}}/last-app:latest .
     # DockerHub에 올린다 
     - name: Push Docker Image 
       run: |
         docker push \
          ${{secrets.DOCKERHUB_USERNAME}}/last-app:latest
     # AWS 연결 => DockerHub 데이터  Pull
     - name: Set SSH key Permission
       run: |
         mkdir -p ~/.ssh
         echo "${{secrets.SERVER_SSH_KEY}}" > ~/.ssh/id_ed25519
         chmod 600 ~/.ssh/id_ed25519
     # ADD SSH Key 
     - name: Add SSH Key 
       uses: webfactory/ssh-agent@v0.5.3
       with:
         ssh-private-key: ${{secrets.SERVER_SSH_KEY}}
     # Add Known_hosts
     - name: Add Known_hosts
       run: |
         ssh-keyscan -H ed25519 13.124.133.9 >> ~/.ssh/known_hosts
     # Jar파일을 AWS 전송 => Docker이미지 
     - name: Deploy to Server with rsync 
       run: |
         rsync -avz -e "ssh -o StrictHostKeyChecking=no" build/libs/*.jar ubuntu@13.124.133.9:~/app
     # 9090 포트 Kill => container 삭제 
     - name: Run command 
       run: |
         ssh -i ~/.ssh/id_ed25519 ubuntu@13.124.133.9 << 'EOF'
           cd ~/app &&
           set -a &&
           source .env &&
           set +a &&
           nohup java -jar ~/app/SpringBootLastProject-0.0.1-SNAPSHOT.jar > log.txt 2>&1 &
         EOF
     # 9090 포트 다시 구동 => docker run
    
  
