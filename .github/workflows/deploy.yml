name: Deploy With Docker to AWS Server

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: SetUp JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'
          
      - name: Set gradlew permission
        run: chmod +x ./gradlew

      - name: Build with Gradlew
        run: ./gradlew clean build -x test

      - name: Login DockerHub
        run: |
          echo "${{secrets.DOCKER_PASSWORD}}" | docker login -u "${{secrets.DOCKER_USERNAME}}" --password-stdin

      - name: Build Docker Image
        run: docker build -t ${{secrets.DOCKER_USERNAME}}/last-app:latest .

      - name: Push Docker Image
        run: docker push ${{secrets.DOCKER_USERNAME}}/last-app:latest

      - name: Set SSH key Permission
        run: |
          mkdir -p ~/.ssh
          echo "${{secrets.SERVER_SSH_KEY}}" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519

      - name: Add SSH Key
        uses: webfactory/ssh-agent@v0.5.3
        with:
          ssh-private-key: ${{secrets.SERVER_SSH_KEY}}

      - name: Add Known_hosts
        run: ssh-keyscan -H ed25519 13.124.133.9 >> ~/.ssh/known_hosts

      - name: DockerHub Image using
        run: |
          ssh ubuntu@13.124.133.9 << 'EOF'
          sudo docker stop last-app || true
          sudo docker rm last-app || true
          
          # 도커 이미지를 다운로드합니다.
          sudo docker pull ${{secrets.DOCKER_USERNAME}}/last-app:latest
          
          sudo docker run -d \
            --name last-app \
            -p 9090:9090 \
            -e DB_URL="${{secrets.DB_URL}}" \
            -e DB_USERNAME="${{secrets.DB_USERNAME}}" \
            -e DB_PASSWORD="${{secrets.DB_PASSWORD}}" \
            ${{secrets.DOCKER_USERNAME}}/last-app:latest
          EOF
